      description: Receives cryptographically signed callbacks from Xendit gateway when an invoice or payment is settled.
      operationId: handleXenditWebhook
      security: []
      parameters:
        - name: x-callback-token
          in: header
          required: true
          description: Verification token configured in Xendit Dashboard
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
