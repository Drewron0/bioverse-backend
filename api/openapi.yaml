          description: Callback processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Mobile consumer user JWT token
    AdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Platform Administrator JWT token

  responses:
    BadRequestError:
      description: Bad request / validation failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnauthorizedError:
      description: Authentication token missing or invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ForbiddenError:
      description: Insufficient permissions or role requirement failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFoundError:
      description: Requested resource was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ConflictError:
      description: Resource conflict or duplicate invariant violation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequestsError:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds before retrying
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: quantity
        message:
          type: string
          example: Must be at least 1 unit

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - code
        - detail
      properties:
        type:
          type: string
          example: urn:bioverse:error:bad_request
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        code:
          type: string
          example: INSUFFICIENT_POINTS
        detail:
          type: string
          example: User points balance is insufficient to burn the requested amount.
        instance:
          type: string
          example: /v1/app/donations/checkout
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'

    StandardSuccessResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully

    HealthStatus:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
          example: ok
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: 1.0.0

    ProjectCategory:
      type: string
      enum: [coral, mangrove, tree]
      example: coral

    ProjectStatus:
      type: string
      enum:
        - draft
        - open_for_donation
        - fully_funded
        - planting
        - monitoring
        - completed
        - cancelled
      example: open_for_donation

    DonationStatus:
      type: string
      enum:
        - pending
        - paid
        - failed
        - expired
        - cancelled
        - refunded
      example: paid

    PaymentStatus:
      type: string
      enum:
        - pending
        - paid
        - failed
        - expired
        - cancelled
        - refunded
      example: paid

    DonationType:
      type: string
      enum:
        - coral_adoption
        - tree_planting
        - mangrove_planting
        - bio_shield_addon
        - maintenance
        - general_support
      example: coral_adoption

    PaymentMethodType:
      type: string
      enum:
        - qris
        - virtual_account
        - ewallet
        - card
        - manual_bank_transfer
        - points_only
        - sponsored_quota
      example: virtual_account

    BankCode:
      type: string
      enum: [BCA, BRI, BNI, MANDIRI, PERMATA]
      example: BCA

    EnvironmentalHealthStatus:
      type: string
      enum:
        - healthy
        - stressed
        - bleaching
        - diseased
        - recovering
        - critical
        - dead
      example: healthy

    FragmentLifecycleStatus:
      type: string
      enum:
        - pending_planting
        - planted
        - monitoring
        - deceased
        - relocated
      example: planted

    PetGrowthStage:
      type: string
      enum:
        - hatchling
        - juvenile
        - adult
        - elder
      example: hatchling

    SubmissionStatus:
      type: string
      enum:
        - pending
        - processing
        - verified
        - rejected
        - needs_review
      example: processing

    SubscriptionStatus:
      type: string
      enum:
        - pending_activation
        - active
        - paused
        - cancelled
        - completed
      example: active

    DigitalItemType:
      type: string
      enum:
        - streak_freeze
        - pet_skin
        - pet_accessory
        - habitat_background
        - xp_boost_item
      example: streak_freeze

    KycVerificationStatus:
      type: string
      enum:
        - pending
        - submitted
        - verified
        - rejected
      example: verified

    PayoutStatus:
      type: string
      enum:
        - draft
        - pending_approval
        - approved
        - processing
        - disbursed
        - failed
        - cancelled
      example: disbursed

    ReportAuditStatus:
      type: string
      enum:
        - draft
        - submitted
        - under_review
        - certified
        - rejected
      example: draft

    UserGender:
      type: string
      enum:
        - male
        - female
        - other
        - prefer_not_to_say
      example: male

    AdminRole:
      type: string
      enum:
        - super_admin
        - operations
        - finance
        - content
        - support
      example: operations

    B2bRole:
      type: string
      enum:
        - corporate_admin
        - esg_manager
        - finance
        - external_auditor
        - viewer
      example: corporate_admin

    B2bPackageType:
      type: string
      enum:
        - starter_bundle
        - enterprise_suite
        - brand_co_creation
        - custom
      example: enterprise_suite

    ContractStatus:
      type: string
      enum:
        - draft
        - pending_payment
        - active
        - expired
        - terminated
      example: active

    ComplianceStatus:
      type: string
      enum:
        - compliant
        - at_risk
        - non_compliant
        - pending_data
      example: compliant

    IapStoreType:
      type: string
      enum: [apple_app_store, google_play]
      example: google_play

    OperatorTaskType:
      type: string
      enum: [frame_installation, planting, replanting, maintenance_cleaning, monitoring_photo, survey]
      example: planting

    OperatorRole:
      type: string
      enum: [diver, planter, site_manager]
      example: diver

    SubscriptionFrequency:
      type: string
      enum: [weekly, monthly, yearly]
      example: monthly

    CurrencyPrice:
      type: object
      required:
        - currency_code
        - amount
      properties:
        currency_code:
          type: string
          example: USD
        amount:
          type: string
          example: "15.00"

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - full_name
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: SecureP@ssw0rd!
        full_name:
          type: string
          example: Budi Samudera
        phone_number:
          type: string
          example: "+6281234567890"
        timezone:
          type: string
          default: Asia/Jakarta
          example: Asia/Jakarta
        preferred_currency_code:
          type: string
          default: USD
          example: USD
        gender:
          $ref: '#/components/schemas/UserGender'
        date_of_birth:
          type: string
          format: date
          example: "1998-05-15"
        referral_code:
          type: string
          example: REEF2026

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: SecureP@ssw0rd!
        device_info:
          type: string
          example: Flutter Pixel 7 Pro Android 14

    GoogleLoginRequest:
      type: object
      required:
        - id_token
      properties:
        id_token:
          type: string
          description: OpenID Connect token issued by Google SDK
          example: eyJhbGciOiJSUzI1NiIsImtpZCI6Ij...
        device_info:
          type: string
          example: Flutter Pixel 7 Pro Android 14

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        device_info:
          type: string
          example: Flutter Pixel 7 Pro Android 14

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: user@example.com

    ResetPasswordRequest:
      type: object
      required:
        - token
        - new_password
      properties:
        token:
          type: string
          example: 6f8d3c1a-7b2e-4f5a-9c8d-1e2f3a4b5c6d
        new_password:
          type: string
          format: password
          minLength: 8
          example: NewStr0ngP@ss!

    VerifyEmailRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          example: 3b1a2c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d

    AdminLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@bioverse.id
        password:
          type: string
          format: password
          example: SuperSecureAdminPass!
        totp_code:
          type: string
          description: 6-digit Time-based One-Time Password for MFA
          example: "123456"

    AuthResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Access token lifespan in seconds (15 minutes)
          example: 900
        user:
          $ref: '#/components/schemas/UserProfile'

    AdminAuthResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
        admin_role:
          $ref: '#/components/schemas/AdminRole'

    AdminMFASetupResponse:
      type: object
      required:
        - secret
        - qr_code_uri
        - account
      properties:
        secret:
          type: string
          example: JBSWY3DPEHPK3PXP
        qr_code_uri:
          type: string
          example: otpauth://totp/BioVerse:admin@bioverse.id?secret=JBSWY3DPEHPK3PXP&issuer=BioVerse&digits=6&period=30
        account:
          type: string
          format: email
          example: admin@bioverse.id

    AdminMFAVerifyRequest:
      type: object
      required:
        - totp_code
      properties:
        totp_code:
          type: string
          minLength: 6
          maxLength: 6
          example: "123456"

    UserProfile:
      type: object
      required:
        - id
        - email
        - full_name
        - timezone
        - preferred_currency_code
        - points_balance
        - locked_points_balance
        - is_email_verified
        - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        phone_number:
          type: string
          nullable: true
        gender:
          $ref: '#/components/schemas/UserGender'
        date_of_birth:
          type: string
          format: date
          nullable: true
        timezone:
          type: string
          example: Asia/Jakarta
        preferred_currency_code:
          type: string
          example: USD
        avatar_url:
          type: string
          nullable: true
        referral_code:
          type: string
          example: REEF2026
        points_balance:
          type: integer
          example: 250
        locked_points_balance:
          type: integer
          example: 0
        is_email_verified:
          type: boolean
          example: true
        current_streak:
          type: integer
          example: 5
        created_at:
          type: string
          format: date-time

    UserStats:
      type: object
      required:
        - user_id
        - current_points
        - current_streak
        - longest_streak
        - total_donations_usd
        - total_donations_idr
        - total_units_adopted
        - missions_completed
      properties:
        user_id:
          type: string
          format: uuid
        current_points:
          type: integer
          example: 250
        current_streak:
          type: integer
          example: 5
        longest_streak:
          type: integer
          example: 12
        total_donations_usd:
          type: string
          example: "45.00"
        total_donations_idr:
          type: string
          example: "720000.00"
        total_units_adopted:
          type: integer
          example: 3
        missions_completed:
          type: integer
          example: 8

    UpdateUserProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          example: Budi Pratama Samudera
        phone_number:
          type: string
          example: "+6281234567890"
        gender:
          $ref: '#/components/schemas/UserGender'
        date_of_birth:
          type: string
          format: date
          example: "1998-05-15"
        timezone:
          type: string
          example: Asia/Jakarta
        preferred_currency_code:
          type: string
          example: USD
