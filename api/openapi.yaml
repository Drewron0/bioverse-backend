openapi: 3.0.3
info:
  title: BioVerse API
  version: 1.0.0
  description: >-
    Official API specification for BioVerse marine conservation and Ridge-to-Reef platform.
    Designed for Flutter mobile consumer clients, Web B2B corporate dashboards, and administrative back-office operations.
  license:
    name: Proprietary / BioVerse Commercial License
    url: https://bioverse.id/legal/license
servers:
  - url: https://api.ourprojects.my.id
    description: Production environment
  - url: http://localhost:8080
    description: Local development environment

tags:
  - name: Health
    description: Service health and readiness probes
  - name: App Auth
    description: Consumer mobile authentication and session management (Phase 1)
  - name: User Profile
    description: Mobile user profile, settings, avatar, and push notifications (Phase 1)
  - name: Uploads
    description: Presigned S3/MinIO object upload authorization (Phase 1-8)
  - name: News & Impact
    description: Conservation news articles and platform-wide impact statistics (Phase 1)
  - name: Conservation
    description: Marine restoration projects, spider frames, and adopted corals (Phase 2)
  - name: Donations
    description: Checkout, multi-currency pricing, settlement in IDR, and history (Phases 3-4)
  - name: Virtual Pets
    description: Ridge-to-Reef companion lifecycle, feeding, equip cosmetics, and evolution (Phase 6)
  - name: Eco-Missions
    description: Action-based missions, photo proof submission, and async CV verification (Phase 6)
  - name: Streaks & Leaderboard
    description: Daily eco-streaks and donation rankings with USD totals and anonymity (Phase 6)
  - name: Shop & Inventory
    description: Digital cosmetic shop, inventory bag, IAP verification, and streak freezes (Phase 7)
  - name: Subscriptions
    description: Recurring coral adoption maintenance plans with pause/resume/cancel (Phase 7)
  - name: Admin Auth
    description: Back-office administrator authentication with MFA (TOTP)
  - name: Admin Field Operations
    description: Operator KYC, work logs, milestone photo evidence, and multi-step payouts (Phase 8 - Admin)
  - name: Admin B2B & ESG
    description: Corporate ESG contracts, quota management, and audit reports (Phase 9 - Admin)
  - name: Notifications
    description: In-app user notifications and read receipts
  - name: B2B Portal
    description: Corporate client web portal dashboard and ESG compliance reports
  - name: Admin Conservation
    description: Back-office administration of conservation zones, projects, and spider frames
  - name: Admin Catalog
    description: Back-office management of digital items and subscription plans
  - name: Admin Gamification
    description: Back-office management of eco-missions and rewards
  - name: Webhooks
    description: External payment gateway callbacks and automated reconciliations

paths:
  /healthz:
    get:
      tags:
        - Health
      summary: Liveness health check
      description: Returns 200 OK if the HTTP server process is running.
      operationId: checkLiveness
      security: []
      responses:
        '200':
          description: Server is live
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /livez:
    get:
      tags:
        - Health
      summary: Container liveness probe
      description: Lightweight ECS/container liveness probe returning OK.
      operationId: checkContainerLiveness
      security: []
      responses:
        '200':
          description: Container is alive
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/health:
    get:
      tags:
        - Health
      summary: Readiness health check
      description: Returns status of internal infrastructure dependencies (PostgreSQL database).
      operationId: checkReadiness
      security: []
      responses:
        '200':
          description: Application and database are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '503':
          description: Application or database is degraded
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /v1/app/auth/register:
    post:
      tags:
        - App Auth
      summary: Register mobile user account
      description: Creates a new consumer user profile with timezone, currency preference, and optional demographics.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/auth/login:
    post:
      tags:
        - App Auth
      summary: Login with email and password
      description: Authenticates user credentials and returns JWT access and refresh tokens.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/auth/google:
    post:
      tags:
        - App Auth
      summary: Login or sign up with Google
      description: Authenticates user using Google ID token issued by Android/iOS Google Sign-In SDK.
      operationId: loginWithGoogle
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: Google authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/auth/refresh:
    post:
      tags:
        - App Auth
      summary: Refresh access token
      description: Exchanges a valid refresh token for a newly signed JWT access token.
      operationId: refreshAuthToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/auth/forgot-password:
    post:
      tags:
        - App Auth
      summary: Request password reset email
      description: Sends a password reset token via Resend transactional email.
      operationId: requestForgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Password reset link dispatched if email exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/auth/reset-password:
    post:
      tags:
        - App Auth
      summary: Reset password with token
      description: Resets user password using the verification token delivered via email.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/auth/verify-email:
    post:
      tags:
        - App Auth
      summary: Verify email address
      description: Verifies user email using the token received in registration confirmation email.
      operationId: verifyEmailAddress
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/auth/logout:
    post:
      tags:
        - App Auth
      summary: Logout user session
      description: Revokes the specified refresh token in user_tokens table.
      operationId: logoutUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: User logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/users/me:
    get:
      tags:
        - User Profile
      summary: Get current user profile
      description: Retrieves profile including timezone, preferred currency, points balance, and locked points.
      operationId: getCurrentUserProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - User Profile
      summary: Update user profile
      description: Updates profile fields (full name, phone number, gender, date of birth, preferred currency, avatar).
      operationId: updateCurrentUserProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: Updated profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/users/me/stats:
    get:
      tags:
        - User Profile
      summary: Get user eco metrics and activity statistics
      description: Retrieves aggregated metrics of total donations (USD/IDR), adopted units, completed missions, points, and streaks.
      operationId: getCurrentUserStats
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStats'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/users/fcm-token:
    post:
      tags:
        - User Profile
      summary: Register mobile device FCM push token
      description: Registers or updates Firebase Cloud Messaging token in user_tokens.
      operationId: registerFcmToken
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FcmTokenRequest'
      responses:
        '200':
          description: FCM token registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/notifications:
    get:
      tags:
        - Notifications
      summary: List user notifications
      description: Retrieves recent in-app notifications for the authenticated user with cursor-based pagination.
      operationId: listUserNotifications
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: RFC3339 timestamp cursor for pagination
          schema:
            type: string
      responses:
        '200':
          description: List of user notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/notifications/{id}/read:
    patch:
      tags:
        - Notifications
      summary: Mark notification as read
      description: Marks a specific notification as read for the authenticated user.
      operationId: markNotificationRead
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Notification UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationItem'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/notifications/read-all:
    post:
      tags:
        - Notifications
      summary: Mark all notifications as read
      description: Marks all unread notifications for the authenticated user as read.
      operationId: markAllNotificationsRead
      security:
        - BearerAuth: []
      responses:
        '200':
          description: All notifications marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/uploads/presign:
    post:
      tags:
        - Uploads
      summary: Request presigned S3/MinIO upload URL
      description: Returns an upload authorization URL and S3 object key for direct client upload.
      operationId: requestPresignedUpload
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignedUploadRequest'
      responses:
        '200':
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/impact/summary:
    get:
      tags:
        - News & Impact
      summary: Get platform impact summary for mobile Home
      description: Aggregates total adopted corals, trees planted, and active guardians across all projects.
      operationId: getImpactSummary
      security: []
      responses:
        '200':
          description: Platform conservation impact metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpactSummary'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/news:
    get:
      tags:
        - News & Impact
      summary: List conservation news and articles
      description: Retrieves published articles filtered by project category (coral, mangrove, tree).
      operationId: listNewsArticles
      security: []
      parameters:
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProjectCategory'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Paginated news articles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNews'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/conservation/projects:
    get:
      tags:
        - Conservation
      summary: List restoration projects
      description: Retrieves coral, mangrove, or tree conservation projects with cursor pagination.
      operationId: listConservationProjects
      security: []
      parameters:
        - name: category
          in: query
          required: false
          description: Filter by ecosystem category (coral, mangrove, tree)
          schema:
            $ref: '#/components/schemas/ProjectCategory'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProjectStatus'
        - name: cursor
          in: query
          required: false
          description: Cursor for keyset pagination
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Paginated conservation projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjects'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/conservation/projects/{id}:
    get:
      tags:
        - Conservation
      summary: Get restoration project detail
      description: Retrieves detailed project specs including target units, funded units, and spider frames.
      operationId: getConservationProjectById
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique project UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project detail data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConservationProject'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/conservation/corals/my:
    get:
      tags:
        - Conservation
      summary: List user's adopted corals
      description: Retrieves all coral fragments adopted by the authenticated user with nickname, tag, and health status.
      operationId: listMyAdoptedCorals
      security:
        - BearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Paginated collection of user's adopted corals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdoptedCorals'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/conservation/units/my:
    get:
      tags:
        - Conservation
      summary: List all user-adopted conservation units
      description: Retrieves all conservation units adopted by the user (corals, mangroves, trees) with progressive milestone photos and monitoring timeline.
      operationId: listMyConservationUnits
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of user-adopted conservation units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConservationUnit'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/conservation/corals/{id}:
    get:
      tags:
        - Conservation
      summary: Get adopted coral detail
      description: Retrieves specific adopted coral details, fragment code, nickname, spider frame, and health status.
      operationId: getAdoptedCoralById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique coral fragment adoption UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Adopted coral details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoptedCoral'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/conservation/corals/{id}/timeline:
    get:
      tags:
        - Conservation
      summary: Get adopted coral milestone photo timeline
      description: Retrieves photographic monitoring updates for months 1, 3, and 6 verified by field operators.
      operationId: getAdoptedCoralTimeline
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique coral fragment adoption UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Timeline milestone photos and growth stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoralMilestoneUpdate'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/donations/checkout:
    post:
      tags:
        - Donations
      summary: Create donation checkout
      description: >-
        Initiates a single donation checkout with display in USD and settlement in IDR via Xendit.
        Supports coral adoption, tree planting, and dedicated Bio-Shield add-on checkout.
        A request with the same Idempotency-Key and identical body returns the original response.
        A request with the same Idempotency-Key but different payload returns 409 Conflict with code: IDEMPOTENCY_KEY_REUSED.
      operationId: createDonationCheckout
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique client-generated UUID to guarantee atomic idempotency
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonationCheckoutRequest'
      responses:
        '201':
          description: Checkout created with payment details and settlement snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationCheckoutResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Coral-First Gating failed (must have active adopted coral to buy Bio-Shield)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/donations/{id}:
    get:
      tags:
        - Donations
      summary: Get donation status
      description: Retrieves transaction status, payment details, settlement values, and expiration countdown.
      operationId: getDonationById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique donation UUID
          schema:
            type: string
            format: uuid
      responses:
