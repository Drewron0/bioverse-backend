openapi: 3.1.0
info:
  title: BioVerse API
  description: >
    BioVerse is a gamified Ridge-to-Reef ecosystem restoration platform API backend.
    Powers B2C Flutter mobile app, B2B web dashboard, and Admin back office.
  version: 1.0.0
  contact:
    name: BioVerse Engineering Team
    email: dev@bioverse.id

servers:
  - url: http://localhost:8080
    description: Local development environment
  - url: https://api.staging.bioverse.id
    description: Staging environment

paths:
  /healthz:
    get:
      summary: Liveness health check
      description: Returns 200 OK if the HTTP server process is running.
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /livez:
    get:
      summary: Kubernetes liveness probe
      responses:
        '200':
          description: Process is responsive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /v1/health:
    get:
      summary: Readiness health check
      description: Returns health status of the application and internal dependencies (database).
      responses:
        '200':
          description: All critical systems healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Degraded system state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /v1/app/auth/register:
    post:
      tags:
        - App Auth
      summary: Register a new user account
      description: Creates a new user profile with default USD currency, zero streak counter, and initial auth tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User successfully registered and authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Email already registered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /v1/app/auth/login:
    post:
      tags:
        - App Auth
      summary: Authenticate user with email and password
      description: Validates argon2id password and returns a fresh JWT access token and rotating refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid email or password
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /v1/app/auth/refresh:
    post:
      tags:
        - App Auth
      summary: Rotate and refresh authentication tokens
      description: Validates an existing refresh token, marks it used/revoked, and returns a new token pair. If a revoked token is reused, all tokens for the user family are revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens rotated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /v1/app/users/me:
    get:
      tags:
        - App Users
      summary: Get authenticated user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - full_name
        - email
        - password
      properties:
        full_name:
          type: string
          example: Budi Pratama
        email:
          type: string
          format: email
          example: budi@bioverse.id
        password:
          type: string
          format: password
          minLength: 8
          example: P@ssword123!
        timezone:
          type: string
          default: Asia/Jakarta
          example: Asia/Jakarta

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: budi@bioverse.id
        password:
          type: string
          format: password
          example: P@ssword123!
        device_info:
          type: string
          example: Flutter Android Pixel 7

    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          example: 9a7b3c2d1e4f...
        device_info:
          type: string
          example: Flutter Android Pixel 7

    AuthResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - user
      properties:
        access_token:
          type: string
          description: 15-minute JWT Bearer token
        refresh_token:
          type: string
          description: Rotating refresh token
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Lifetime of access_token in seconds (e.g. 900 for 15m)
          example: 900
        user:
          $ref: '#/components/schemas/UserProfileResponse'

    UserProfileResponse:
      type: object
      required:
        - id
        - full_name
        - email
        - timezone
        - preferred_currency_code
        - points_balance
        - current_streak
      properties:
        id:
          type: string
          format: uuid
          example: 0193297a-96e0-7988-9271-e0e649ce4301
        full_name:
          type: string
          example: Budi Pratama
        email:
          type: string
          example: budi@bioverse.id
        timezone:
          type: string
          example: Asia/Jakarta
        preferred_currency_code:
          type: string
          example: USD
        points_balance:
          type: integer
          example: 0
        current_streak:
          type: integer
          example: 0

    HealthResponse:
      type: object
      required:
        - status
        - app
        - uptime
        - timestamp
        - services
      properties:
        status:
          type: string
          enum: [ok, degraded]
          example: ok
        app:
          type: string
          example: BioVerse Backend
        uptime:
          type: string
          example: 45m20s
        timestamp:
          type: string
          format: date-time
          example: '2026-11-14T15:00:00Z'
        services:
          type: object
          additionalProperties:
            type: string
          example:
            database: connected

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - code
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Invalid request parameters provided.
        instance:
          type: string
          example: /v1/app/auth/register
        code:
          type: string
          example: BAD_REQUEST
        errors:
          type: object
          additionalProperties:
            type: string
          example:
            email: Must be a valid email address.
