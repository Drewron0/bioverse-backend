openapi: 3.0.3
info:
  title: BioVerse API
  version: 1.0.0
  description: >-
    Official API specification for BioVerse marine conservation and Ridge-to-Reef platform.
    Designed for Flutter mobile consumer clients, Web B2B corporate dashboards, and administrative back-office operations.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
    description: Local development environment
  - url: https://api.bioverse.id
    description: Production environment (AWS ECS - Planned)

tags:
  - name: Health
    description: Service health and readiness probes
  - name: App Auth
    description: Consumer mobile authentication and session management (Phase 1)
  - name: User Profile
    description: Mobile user profile, settings, avatar, and push notifications (Phase 1)
  - name: Uploads
    description: Presigned S3/MinIO object upload authorization
  - name: Conservation
    description: Marine restoration projects, spider frames, and adopted corals (Phase 2)
  - name: Donations
    description: Checkout, payment methods, point redemption, and donation history (Phases 3-4)
  - name: Virtual Pets
    description: Ridge-to-Reef companion lifecycle, feeding, and evolution (Phase 6 - Planned)
  - name: Eco-Missions
    description: Action-based missions, photo proof submission, and async CV verification (Phase 6 - Planned)
  - name: Streaks & Leaderboard
    description: Daily eco-streaks and public donation rankings (Phase 6 - Planned)
  - name: Shop & Inventory
    description: Digital cosmetic shop, inventory bag, and streak protection items (Phase 7 - Planned)
  - name: Subscriptions
    description: Recurring coral adoption maintenance plans (Phase 7 - Planned)
  - name: Admin Field Operations
    description: Operator KYC, work logs, milestone photo evidence, and payouts (Phase 8 - Admin)
  - name: Admin B2B & ESG
    description: Corporate ESG contracts, quota management, and audit reports (Phase 9 - Admin)
  - name: Webhooks
    description: External payment gateway callbacks and automated reconciliations

paths:
  /healthz:
    get:
      tags:
        - Health
      summary: Liveness health check
      description: Returns 200 OK if the HTTP server process is running.
      operationId: checkLiveness
      security: []
      responses:
        '200':
          description: Server is live
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /livez:
    get:
      tags:
        - Health
      summary: Container liveness probe
      description: Lightweight ECS/container liveness probe returning OK.
      operationId: checkContainerLiveness
      security: []
      responses:
        '200':
          description: Container is alive
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/health:
    get:
      tags:
        - Health
      summary: Readiness health check
      description: Returns status of internal infrastructure dependencies (PostgreSQL database).
      operationId: checkReadiness
      security: []
      responses:
        '200':
          description: Application and database are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '503':
          description: Application or database is degraded
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /v1/app/auth/register:
    post:
      tags:
        - App Auth
      summary: Register mobile user account
      description: Creates a new consumer user profile with email and password.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/auth/login:
    post:
      tags:
        - App Auth
      summary: Login with email and password
      description: Authenticates user credentials and returns JWT access and refresh tokens.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/auth/google:
    post:
      tags:
        - App Auth
      summary: Login or sign up with Google
      description: Authenticates user using Google ID token issued by Android/iOS Google Sign-In SDK.
      operationId: loginWithGoogle
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: Google authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/auth/refresh:
    post:
      tags:
        - App Auth
      summary: Refresh access token
      description: Exchanges a valid refresh token for a newly signed JWT access token.
      operationId: refreshAuthToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/auth/forgot-password:
    post:
      tags:
        - App Auth
      summary: Request password reset email
      description: Sends a password reset token via Resend transactional email if the email exists.
      operationId: requestForgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Password reset link dispatched if email exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/auth/reset-password:
    post:
      tags:
        - App Auth
      summary: Reset password with token
      description: Resets user password using the verification token delivered via email.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/auth/verify-email:
    post:
      tags:
        - App Auth
      summary: Verify email address
      description: Verifies user email using the token received in registration confirmation email.
      operationId: verifyEmailAddress
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/auth/logout:
    post:
      tags:
        - App Auth
      summary: Logout user session
      description: Revokes the specified refresh token in the database.
      operationId: logoutUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: User logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/users/me:
    get:
      tags:
        - User Profile
      summary: Get current user profile
      description: Retrieves complete authenticated profile, points balance, locked points, and referral code.
      operationId: getCurrentUserProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - User Profile
      summary: Update user profile
      description: Updates editable profile fields such as full name, phone number, and avatar object key.
      operationId: updateCurrentUserProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: Updated profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/users/fcm-token:
    post:
      tags:
        - User Profile
      summary: Register mobile device FCM push token
      description: Upserts Firebase Cloud Messaging token for push notifications.
      operationId: registerFcmToken
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FcmTokenRequest'
      responses:
        '200':
          description: FCM token registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/uploads/presign:
    post:
      tags:
        - Uploads
      summary: Request presigned S3/MinIO upload URL
      description: Returns an upload authorization URL and S3 object key for direct client upload.
      operationId: requestPresignedUpload
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignedUploadRequest'
      responses:
        '200':
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/conservation/projects:
    get:
      tags:
        - Conservation
      summary: List restoration projects
      description: Retrieves available coral reef restoration projects with funding and urgent status.
      operationId: listConservationProjects
      security: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProjectStatus'
        - name: is_urgent
          in: query
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of active conservation projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConservationProject'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/conservation/projects/{id}:
    get:
      tags:
        - Conservation
      summary: Get restoration project detail
      description: Retrieves detailed project specs including target corals, funded corals, and spider frames.
      operationId: getConservationProjectById
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique project UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project detail data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConservationProject'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/conservation/corals/my:
    get:
      tags:
        - Conservation
      summary: List user's adopted corals
      description: Retrieves all coral fragments adopted by the authenticated user with tags and health status.
      operationId: listMyAdoptedCorals
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Collection of adopted corals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdoptedCoral'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/conservation/corals/{id}:
    get:
      tags:
        - Conservation
      summary: Get adopted coral detail
      description: Retrieves specific adopted coral details, tag, spider frame position, and planting date.
      operationId: getAdoptedCoralById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique coral fragment adoption UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Adopted coral details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoptedCoral'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/conservation/corals/{id}/timeline:
    get:
      tags:
        - Conservation
      summary: Get adopted coral milestone photo timeline
      description: Retrieves photographic monitoring updates for months 1, 3, and 6 verified by field operators.
      operationId: getAdoptedCoralTimeline
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique coral fragment adoption UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Timeline milestone photos and growth stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoralMilestoneUpdate'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/donations/checkout:
    post:
      tags:
        - Donations
      summary: Create donation checkout
      description: >-
        Initiates a single donation checkout with Xendit Sandbox payment methods (QRIS, VA) or points.
        Bio-Shield add-on must be purchased as a dedicated checkout with donation_type=bio_shield_addon.
      operationId: createDonationCheckout
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique client-generated UUID to guarantee atomic idempotency
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonationCheckoutRequest'
      responses:
        '201':
          description: Checkout created with payment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationCheckoutResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Coral-First Gating failed (must have active adopted coral to buy Bio-Shield)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/donations/{id}:
    get:
      tags:
        - Donations
      summary: Get donation status
      description: Retrieves transaction status, payment details, and expiration countdown.
      operationId: getDonationById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique donation UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Donation transaction details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/donations:
    get:
      tags:
        - Donations
      summary: List user donation history
      description: Retrieves paginated history of past donations with filter options.
      operationId: listDonationHistory
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DonationStatus'
        - name: donation_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DonationType'
        - name: cursor
          in: query
          required: false
          description: Opaque cursor for keyset pagination
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated donation history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDonations'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/pets:
    get:
      tags:
        - Virtual Pets
      summary: List user virtual pets
      description: Retrieves virtual companion pets (Acep, Budi) adopted by the user.
      operationId: listUserPets
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of virtual pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VirtualPet'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Virtual Pets
      summary: Adopt new virtual pet
      description: Creates a new virtual companion (e.g. Acep the Sea Turtle).
      operationId: adoptVirtualPet
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePetRequest'
      responses:
        '201':
          description: Pet adopted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualPet'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/pets/{id}:
    get:
      tags:
        - Virtual Pets
      summary: Get virtual pet detail
      description: Retrieves level, health percent, XP, and growth stage for a specific pet.
      operationId: getVirtualPetById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Pet UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pet details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualPet'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/pets/{id}/interact:
    post:
      tags:
        - Virtual Pets
      summary: Interact with virtual pet
      description: Feed or care for companion to boost health and earn pet XP.
      operationId: interactWithPet
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Pet UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetInteractionRequest'
      responses:
        '200':
          description: Interaction recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetInteractionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/missions:
    get:
      tags:
        - Eco-Missions
      summary: List daily eco-action missions
      description: Retrieves active missions with point rewards and verification requirements.
      operationId: listEcoMissions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Available eco missions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EcoMission'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/missions/{id}/submit:
    post:
      tags:
        - Eco-Missions
      summary: Submit photo proof for eco-mission
      description: Submits uploaded object key for asynchronous Computer Vision validation. Returns 202 Accepted.
      operationId: submitMissionProof
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Mission UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionSubmissionRequest'
      responses:
        '202':
          description: Submission accepted for asynchronous processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionSubmissionReceipt'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: Mission already completed today
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/mission-submissions/{id}:
    get:
      tags:
        - Eco-Missions
      summary: Check mission proof submission status
      description: Polls status of Computer Vision validation for a mission submission.
      operationId: getMissionSubmissionStatus
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Submission UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current verification status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionSubmissionDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/app/streaks:
    get:
      tags:
        - Streaks & Leaderboard
      summary: Get user daily eco-streak
