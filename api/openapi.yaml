openapi: 3.1.0
info:
  title: BioVerse API
  description: >
    BioVerse is a gamified Ridge-to-Reef ecosystem restoration platform API backend.
    Powers B2C Flutter mobile app, B2B web dashboard, and Admin back office.
  version: 1.0.0
  contact:
    name: BioVerse Engineering Team
    email: dev@bioverse.id

servers:
  - url: http://localhost:8080
    description: Local development environment
  - url: https://api.staging.bioverse.id
    description: Staging environment

paths:
  /healthz:
    get:
      summary: Liveness health check
      description: Returns 200 OK if the HTTP server process is running.
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /livez:
    get:
      summary: Kubernetes liveness probe
      responses:
        '200':
          description: Process is responsive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /v1/health:
    get:
      summary: Readiness health check
      description: Returns health status of the application and internal dependencies (database).
      responses:
        '200':
          description: All critical systems healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Degraded system state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /v1/app/auth/register:
    post:
      tags:
        - App Auth
      summary: Register a new user account
      description: Creates a new user profile with default USD currency, zero streak counter, and initial auth tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User successfully registered and authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Email already registered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /v1/app/auth/login:
    post:
      tags:
        - App Auth
      summary: Authenticate user with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid credentials format
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Incorrect email or password
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /v1/app/auth/refresh:
    post:
      tags:
        - App Auth
      summary: Rotate refresh token and issue new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /v1/app/users/me:
    get:
      tags:
        - App Users
      summary: Get authenticated user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /v1/app/conservation/projects:
    get:
      tags:
        - Conservation
      summary: List all active conservation restoration projects
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConservationProject'

  /v1/app/conservation/projects/{id}:
    get:
      tags:
        - Conservation
      summary: Get conservation project details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConservationProject'
        '404':
          description: Project not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /v1/app/conservation/corals/my:
    get:
      tags:
        - Conservation
      summary: List adopted coral fragments belonging to the authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User coral fragments
          content:
            application/json:
              schema:
                type: object
                properties:
                  corals:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdoptedCoral'

  /v1/app/catalog/products:
    get:
      tags:
        - Catalog
      summary: List digital shop products (Streak Freeze, XP Boost, Skins)
      responses:
        '200':
          description: Products list
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/DigitalProduct'

  /v1/app/catalog/plans:
    get:
      tags:
        - Catalog
      summary: List subscription maintenance plans (BioVerse Plus)
      responses:
        '200':
          description: Subscription plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/SubscriptionPlan'

  /v1/app/donations/checkout:
    post:
      tags:
        - Donations
      summary: Create donation checkout with atomic idempotency and points locking
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonationCheckoutRequest'
      responses:
        '201':
          description: Checkout created with payment instructions (QRIS / VA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationCheckoutResponse'
        '403':
          description: Coral-First Gating failed (Bio-Shield requested without owning a coral)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /v1/app/donations/{id}:
    get:
      tags:
        - Donations
      summary: Get donation payment status and countdown
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Donation record details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationCheckoutResponse'

  /v1/app/donations/my:
    get:
      tags:
        - Donations
      summary: Get authenticated user donation history
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of user donations
          content:
            application/json:
              schema:
                type: object
                properties:
                  donations:
                    type: array
                    items:
                      $ref: '#/components/schemas/DonationCheckoutResponse'

  /v1/webhooks/xendit/simulate-paid:
    post:
      tags:
        - Donations
      summary: Simulate payment settlement webhook (Sandbox & Testing)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - donation_id
              properties:
                donation_id:
                  type: string
                  format: uuid
                target_pet_id:
                  type: string
                  format: uuid
                coral_nickname:
                  type: string
      responses:
        '200':
          description: Payment processed, spider frame assigned, and fragments allocated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: paid

  /v1/app/pets:
    get:
      tags:
        - Gamification
      summary: List virtual pets owned by user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User pets list
          content:
            application/json:
              schema:
                type: object
                properties:
                  pets:
                    type: array
                    items:
                      $ref: '#/components/schemas/VirtualPet'
    post:
      tags:
        - Gamification
      summary: Adopt a new virtual pet companion
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdoptPetRequest'
      responses:
        '201':
          description: Pet companion adopted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualPet'

  /v1/app/pets/{id}:
    get:
      tags:
        - Gamification
      summary: Get virtual pet details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Virtual pet details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualPet'

  /v1/app/pets/{id}/interact:
    post:
      tags:
        - Gamification
      summary: Feed / interact with virtual pet to restore health and gain XP
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Interaction updated pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualPet'

  /v1/app/missions:
    get:
      tags:
        - Gamification
      summary: List active eco-missions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active eco-missions list
          content:
            application/json:
              schema:
                type: object
                properties:
                  missions:
                    type: array
                    items:
                      $ref: '#/components/schemas/EcoMission'

  /v1/app/missions/{id}/submit:
    post:
      tags:
        - Gamification
      summary: Submit camera proof for an eco-mission with Computer Vision verification
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - proof_image_url
              properties:
                proof_image_url:
                  type: string
                  format: uri
                  example: https://storage.bioverse.id/proofs/tumbler.jpg
                target_pet_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Mission verified, XP and Points awarded, streak updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionSubmissionResult'
        '409':
          description: Daily mission already submitted today
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /v1/app/streaks:
    get:
      tags:
        - Gamification
      summary: Get current streak and freeze status
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Streak information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStreak'

  /v1/app/leaderboard:
    get:
      tags:
        - Gamification
      summary: Get global user leaderboard ranking
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Leaderboard rankings
          content:
            application/json:
              schema:
                type: object
                properties:
                  leaderboard:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeaderboardEntry'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - full_name
        - email
        - password
      properties:
        full_name:
          type: string
          example: Budi Pratama
        email:
          type: string
          format: email
          example: budi@bioverse.id
        password:
          type: string
          format: password
          minLength: 8
          example: P@ssword123!
        timezone:
          type: string
          default: Asia/Jakarta
          example: Asia/Jakarta

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: budi@bioverse.id
        password:
          type: string
          format: password
          example: P@ssword123!
        device_info:
          type: string
          example: Flutter Android Pixel 7

    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          example: 9a7b3c2d1e4f...
        device_info:
          type: string
          example: Flutter Android Pixel 7

    AuthResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - user
      properties:
        access_token:
          type: string
          description: 15-minute JWT Bearer token
        refresh_token:
          type: string
          description: Rotating refresh token
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
        user:
          $ref: '#/components/schemas/UserProfileResponse'

    UserProfileResponse:
      type: object
      required:
        - id
        - full_name
        - email
        - timezone
        - preferred_currency_code
        - points_balance
        - current_streak
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
          example: Budi Pratama
        email:
          type: string
          example: budi@bioverse.id
        timezone:
          type: string
          example: Asia/Jakarta
        preferred_currency_code:
          type: string
          example: USD
        points_balance:
          type: integer
          example: 120
        current_streak:
          type: integer
          example: 3

    ConservationProject:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Biorock Coral Restoration Pemuteran
        description:
          type: string
        category:
          type: string
          example: coral
        species_or_type_name:
          type: string
          example: Acropora & Pocillopora
        image_url:
          type: string
        price_per_unit_money:
          type: string
          example: '3.20'
        currency_code:
          type: string
          example: USD
        target_units:
          type: integer
          example: 1500
        funded_units_count:
          type: integer
          example: 420
        planted_units_count:
          type: integer
          example: 300
        surviving_units_count:
          type: integer
          example: 285

    AdoptedCoral:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fragment_code:
          type: string
          example: CR-BALI-001-01
        frame_code:
          type: string
          example: SF-BALI-001
        nickname:
          type: string
          example: Coral Acep
        lifecycle_status:
          type: string
          example: planted
        health_percent:
          type: integer
          example: 100
        planted_at:
          type: string
          format: date-time

    DigitalProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku_code:
          type: string
          example: STREAK_FREEZE_1X
        name:
          type: string
          example: Streak Freeze
        description:
          type: string
        item_type:
          type: string
          example: streak_freeze
        price_points:
          type: integer
          example: 150
        preview_asset_url:
          type: string

    SubscriptionPlan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku_code:
          type: string
          example: BIOVERSE_PLUS_MONTHLY
        name:
          type: string
          example: BioVerse Plus Monthly
        description:
          type: string
        billing_interval:
          type: string
          example: monthly

    DonationCheckoutRequest:
      type: object
      required:
        - project_id
        - unit_quantity
        - payment_method
      properties:
        idempotency_key:
          type: string
          format: uuid
          example: 0193297a-96e0-7988-9271-e0e649ce4999
        project_id:
          type: string
          format: uuid
        unit_quantity:
          type: integer
          minimum: 1
          example: 1
        include_bio_shield:
          type: boolean
          default: false
        target_pet_id:
          type: string
          format: uuid
        coral_nickname:
          type: string
          example: Budi's Coral
        points_to_use:
          type: integer
          default: 0
        payment_method:
          type: string
          enum: [qris, bca_va, mandiri_va, bri_va, bni_va, ewallet]
          example: qris

    DonationCheckoutResponse:
      type: object
      properties:
        donation_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        gross_project_value:
          type: string
          example: '3.20'
        money_amount_paid:
          type: string
          example: '3.20'
        currency_code:
          type: string
          example: USD
        settlement_amount:
          type: string
          example: '51200.00'
        settlement_currency:
          type: string
          example: IDR
        points_used:
          type: integer
          example: 0
        points_discount:
          type: string
          example: '0.00'
        payment_method:
          type: string
          example: qris
        qris_payload:
          type: string
        va_number:
          type: string
        bank_code:
          type: string
        payment_status:
          type: string
          example: pending
        expired_at:
          type: string
          format: date-time

    VirtualPet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pet_name:
          type: string
          example: Acep
        pet_species:
          type: string
          example: turtle
        coral_type:
          type: string
          example: Acropora
        growth_stage:
          type: string
          example: hatchling
        health_percent:
          type: integer
          example: 100
        level:
          type: integer
          example: 1
        experience_points:
          type: integer
          example: 35
        is_primary:
          type: boolean
          example: true

    AdoptPetRequest:
      type: object
      required:
        - pet_name
        - pet_species
        - coral_type
      properties:
        pet_name:
          type: string
          example: Acep
        pet_species:
          type: string
          example: turtle
        coral_type:
          type: string
          example: Acropora
        fragment_id:
          type: string
          format: uuid
        make_primary:
          type: boolean
          default: false

    EcoMission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Reusable Tumbler Snap
        description:
          type: string
        category:
          type: string
          example: lifestyle
        difficulty:
          type: string
          example: easy
        points_reward:
          type: integer
          example: 50
        xp_reward:
          type: integer
          example: 25
        requires_camera_proof:
          type: boolean
          example: true

    MissionSubmissionResult:
      type: object
      properties:
        submission_id:
          type: string
          format: uuid
        mission_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [verified, rejected, pending]
          example: verified
        awarded_points:
          type: integer
          example: 50
        awarded_xp:
          type: integer
          example: 25
        current_streak:
          type: integer
          example: 1
        verified_at:
          type: string
          format: date-time
        rejection_notes:
          type: string

    UserStreak:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        current_streak:
          type: integer
          example: 3
        longest_streak:
          type: integer
          example: 7
        last_streak_date:
          type: string
          format: date
          example: '2026-11-14'

    LeaderboardEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
          example: Budi Pratama
        avatar_url:
          type: string
        points_balance:
          type: integer
          example: 450
        rank_position:
          type: integer
          example: 1

    HealthResponse:
      type: object
      required:
        - status
        - app
        - uptime
        - timestamp
        - services
      properties:
        status:
          type: string
          enum: [ok, degraded]
          example: ok
        app:
          type: string
          example: BioVerse Backend
        uptime:
          type: string
          example: 45m20s
        timestamp:
          type: string
          format: date-time
          example: '2026-11-14T15:00:00Z'
        services:
          type: object
          additionalProperties:
            type: string
          example:
            database: connected

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - code
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Invalid request parameters provided.
        instance:
          type: string
          example: /v1/app/auth/register
        code:
          type: string
          example: BAD_REQUEST
        errors:
          type: object
          additionalProperties:
            type: string
          example:
            email: Must be a valid email address.
