components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User or Administrator JWT token

  responses:
    BadRequestError:
      description: Bad request / validation failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnauthorizedError:
      description: Authentication token missing or invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ForbiddenError:
      description: Insufficient permissions or role requirement failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFoundError:
      description: Requested resource was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ConflictError:
      description: Resource conflict or duplicate invariant violation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          example: urn:bioverse:error:bad_request
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Validation failed on field quantity
        instance:
          type: string
          example: /v1/app/donations/checkout

    StandardSuccessResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully

    HealthStatus:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
          example: ok
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: 1.0.0

    ProjectStatus:
      type: string
      enum: [draft, funding, active, completed, suspended]
      example: active

    DonationStatus:
      type: string
      enum: [pending, paid, expired, failed, refunded]
      example: paid

    DonationType:
      type: string
      enum: [coral_adoption, tree_planting, bio_shield_addon, sponsored_quota]
      example: coral_adoption

    PaymentMethodType:
      type: string
      enum: [virtual_account, qris, card, points_only, sponsored_quota]
      example: virtual_account

    BankCode:
      type: string
      enum: [BCA, BRI, BNI, MANDIRI, PERMATA]
      example: BCA

    CoralHealthStatus:
      type: string
      enum: [thriving, stable, bleached, critical, deceased]
      example: thriving

    PetGrowthStage:
      type: string
      enum: [hatchling, juvenile, sub_adult, adult, ancient]
      example: hatchling

    SubmissionStatus:
      type: string
      enum: [submitted, processing, verified, needs_review, rejected]
      example: processing

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - full_name
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: SecureP@ssw0rd!
        full_name:
          type: string
          example: Budi Samudera
        phone_number:
          type: string
          example: "+6281234567890"
        referral_code:
          type: string
          example: REEF2026

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: SecureP@ssw0rd!

    GoogleLoginRequest:
      type: object
      required:
        - id_token
      properties:
        id_token:
          type: string
          description: OpenID Connect token issued by Google SDK
          example: eyJhbGciOiJSUzI1NiIsImtpZCI6Ij...

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: user@example.com

    ResetPasswordRequest:
      type: object
      required:
        - token
        - new_password
      properties:
        token:
          type: string
          example: 6f8d3c1a-7b2e-4f5a-9c8d-1e2f3a4b5c6d
        new_password:
          type: string
          format: password
          minLength: 8
          example: NewStr0ngP@ss!

    VerifyEmailRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          example: 3b1a2c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d

    AuthResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      required:
        - id
        - email
        - full_name
        - points_balance
        - locked_points_balance
        - is_email_verified
        - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        phone_number:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        referral_code:
          type: string
        points_balance:
          type: integer
          example: 250
        locked_points_balance:
          type: integer
          example: 0
        is_email_verified:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time

    UpdateUserProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          example: Budi Pratama Samudera
        phone_number:
          type: string
          example: "+6281234567890"
        avatar_object_key:
          type: string
          example: avatars/01a1d9e4-b3c4-7e54-8795-192296827d75.jpg

