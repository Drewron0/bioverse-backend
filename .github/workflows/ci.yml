name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Go Test & Vet
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bioverse
          POSTGRES_PASSWORD: bioverse_test_password
          POSTGRES_DB: bioverse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://bioverse:bioverse_test_password@localhost:5432/bioverse_test?sslmode=disable
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: bioverse
      DB_PASSWORD: bioverse_test_password
      DB_NAME: bioverse_test
      DB_SSLMODE: disable
      APP_ENV: test
      JWT_SECRET: supersecretjwtkeyforciintegrationtests12345
      ADMIN_JWT_SECRET: supersecretadminjwtkeyforciintegrationtests12345
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Verify Go module dependencies
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Install Goose & Run Migrations
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
          goose -dir db/migrations postgres "$DATABASE_URL" up

      - name: Run Tests with Race Detector
        run: go test -v -race -count=1 ./...

  openapi-lint:
    name: OpenAPI Contract Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint OpenAPI Specification (v3.0.3)
        run: npx --yes @redocly/cli lint api/openapi.yaml

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: [test-and-lint, openapi-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Check deployment secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.SERVER_HOST }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "SERVER_HOST secret not configured. Skipping automated deployment."
          fi

      - name: Deploy via SSH
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            APP_DIR="${{ secrets.SERVER_APP_DIR || '/var/www/bioverse' }}"
            if [ -d "$APP_DIR" ]; then
              echo "Deploying to $APP_DIR..."
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
              docker compose up -d --build
              docker image prune -f
              echo "BioVerse deployed successfully!"
            else
              echo "Directory $APP_DIR not found. Please clone repository into $APP_DIR first."
              exit 1
            fi
