name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Go Test & Vet
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bioverse
          POSTGRES_PASSWORD: bioverse_test_password
          POSTGRES_DB: bioverse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://bioverse:bioverse_test_password@localhost:5432/bioverse_test?sslmode=disable
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: bioverse
      DB_PASSWORD: bioverse_test_password
      DB_NAME: bioverse_test
      DB_SSLMODE: disable
      APP_ENV: test
      JWT_SECRET: supersecretjwtkeyforciintegrationtests12345
      ADMIN_JWT_SECRET: supersecretadminjwtkeyforciintegrationtests12345
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Verify Go module dependencies
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Install Goose & Run Migrations
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
          goose -dir db/migrations postgres "$DATABASE_URL" up

      - name: Run Tests with Race Detector
        run: go test -v -race -count=1 ./...

  openapi-lint:
    name: OpenAPI Contract Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint OpenAPI Specification (v3.0.3)
        run: npx --yes @redocly/cli lint api/openapi.yaml

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: [test-and-lint, openapi-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Run Supabase Database Migrations
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
          goose -dir db/migrations postgres "${{ secrets.SUPABASE_DB_URL }}" up

      - name: Build Linux Binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bioverse-api ./cmd/api
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bioverse-worker ./cmd/worker

      - name: Upload Binaries via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "bioverse-api,bioverse-worker"
          target: "/home/bioverse-ssh"

      - name: Restart Services and Verify Health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            mv -f /home/bioverse-ssh/bioverse-api /home/bioverse-ssh/bioverse-backend/bioverse-api
            mv -f /home/bioverse-ssh/bioverse-worker /home/bioverse-ssh/bioverse-backend/bioverse-worker
            chmod +x /home/bioverse-ssh/bioverse-backend/bioverse-api /home/bioverse-ssh/bioverse-backend/bioverse-worker
            systemctl --user restart bioverse-api bioverse-worker
            sleep 2
            curl -sf http://localhost:8085/healthz